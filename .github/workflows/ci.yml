name: beltline
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/*.test.mjs
      - run: node examples/calc/build.mjs && node examples/catalogue/build.mjs && node examples/velocitty/build.mjs
      - run: node scripts/check.mjs examples/calc/beltline.svg && node scripts/check.mjs examples/catalogue/beltline.svg --max-texts 320 && node scripts/check.mjs examples/velocitty/beltline.svg
      - run: node scripts/check-sources.mjs examples/calc/beltline.svg examples/calc
      - run: git clone --quiet --filter=blob:none https://github.com/valvesky/velocitty "$RUNNER_TEMP/velocitty" && node scripts/check-sources.mjs examples/velocitty/beltline.svg "$RUNNER_TEMP/velocitty"
      - run: git diff --exit-code -- examples
      - run: cmp examples/calc/beltline.svg docs/tours/calc.svg && cmp examples/catalogue/beltline.svg docs/tours/catalogue.svg && cmp examples/velocitty/beltline.svg docs/tours/velocitty.svg
